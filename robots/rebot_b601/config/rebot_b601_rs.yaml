# reBot B601-RS 机器人配置。相对路径以本文件所在目录为基准。
# 描述文件由 scripts/generate_description.py 生成。
robot: rebot_b601_rs

description:
  urdf: ../generated/urdf/rebot_b601_rs.urdf
  mjcf: ../generated/mjcf/scene.xml
  srdf: ../generated/srdf/rebot_b601_rs.srdf

control:
  period_us: 4000

# 位置与力矩限值取自 URDF；速度、加速度、加加速度是保守初值，待实测后调整。
# 刚度与阻尼取自 reBotArm_control_py 的 MIT 默认增益。
joints:
  - name: joint1
    limits: {position: [-2.8, 2.8], velocity: 2.0, acceleration: 5.0, jerk: 50.0, effort: 36.0}
    gains: {stiffness: 50.0, damping: 3.0}
  - name: joint2
    limits: {position: [0.0, 3.14], velocity: 2.0, acceleration: 5.0, jerk: 50.0, effort: 36.0}
    gains: {stiffness: 150.0, damping: 10.0}
  - name: joint3
    limits: {position: [0.0, 3.14], velocity: 2.0, acceleration: 5.0, jerk: 50.0, effort: 36.0}
    gains: {stiffness: 150.0, damping: 10.0}
  - name: joint4
    limits: {position: [-1.57, 1.57], velocity: 3.0, acceleration: 8.0, jerk: 80.0, effort: 14.0}
    gains: {stiffness: 50.0, damping: 5.0}
  - name: joint5
    limits: {position: [-1.57, 1.57], velocity: 3.0, acceleration: 8.0, jerk: 80.0, effort: 14.0}
    gains: {stiffness: 50.0, damping: 4.0}
  - name: joint6
    limits: {position: [-3.14, 3.14], velocity: 3.0, acceleration: 8.0, jerk: 80.0, effort: 14.0}
    gains: {stiffness: 50.0, damping: 4.0}
  # 夹爪以单指位移（米）表示，对应描述中的 joint_left。真机实测行程：闭合时电机约 -0.01 rad，张开到头
  # 约 5.81 rad（按 7.353 mm/rad 为 42.7 mm），上限留出约 0.1 rad。增益取 LeRobot reBot B601 夹爪的
  # MIT 增益（电机侧 kp 8、kd 0.3），经 7.353 mm/rad 换算。力上限即最大夹持力：真机实测起动力约 45 N
  # （40 N 推不动，50 N 推动），运动中摩擦 20-45 N；取 70 N（电机侧约 0.51 Nm），约为起动力的 1.5 倍。
  - name: gripper
    description_joint: joint_left
    unit: meter
    limits: {position: [0.0, 0.042], velocity: 0.05, acceleration: 0.5, jerk: 5.0, effort: 70.0}
    gains: {stiffness: 150000.0, damping: 5500.0}

groups:
  arm:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    base: base_link
    tool: gripper_end
    # gripper_end 约在两指尖之间；换工具时改这里（相对 gripper_end，URDF 的 xyz 与 rpy 约定）。
    tcp: {xyz: [0, 0, 0], rpy: [0, 0, 0]}
    # 直线运动的保守初值，待实测后调整。
    cartesian_limits: {linear_velocity: 0.1, linear_acceleration: 0.5, angular_velocity: 0.5, angular_acceleration: 2.0}
  gripper: {joints: [gripper]}

safety:
  limit_tolerance: 0.05
  feedback_timeout_cycles: 3
  tracking_error_limit: {radian: 0.3, meter: 0.02}
  enable_ramp_ms: 500
  # q=0 为折叠姿态：大臂、小臂压在各自的下限上，腕部靠在大臂上；该机械臂无抱闸，只在此姿态失能。
  rest_pose: [0, 0, 0, 0, 0, 0, 0]

# 命名姿态，每个关节一个值。ready：小臂抬起、腕部离开大臂的工作准备姿态，末端系运动从这里开始。
poses:
  ready: [0, 0.7, 1.1, 0, 0, 0, 0]

# 重力标定（2026-10-23）：driver_probe calibrate 在 config/gravity_calibration_poses.yaml 的 25 个无接触姿态上
# 以 0.04 rad/s 上下扫描，scripts/fit_gravity.py 以 CAD 为先验拟合连杆质量与质心。8 个验证姿态上 joint2/3/4
# 的残差 RMS 由 0.37/0.33/0.13 降到 0.14/0.12/0.05 N·m。同时测得 joint2-6 的库仑摩擦约
# 0.23/0.41/0.20/0.16/0.17 N·m。link6 的增量包含夹爪处未建模的质量（夹爪零件固定为 CAD）。
dynamics:
  links:
    link2: {mass: 1.5520, com: [-0.11351, 0.00159, -0.02716]}  # CAD 1.5520 kg, [-0.11786, -0.00342, -0.02716]
    link3: {mass: 1.1890, com: [0.11298, -0.04726, -0.02854]}  # CAD 1.2520 kg, [0.10343, -0.06641, -0.02711]
    link4: {mass: 0.4248, com: [0.06111, -0.05347, -0.03402]}  # CAD 0.4600 kg, [0.04755, -0.04411, -0.03141]
    link5: {mass: 0.2131, com: [0.01023, 0.00753, 0.03390]}  # CAD 0.2012 kg, [0.01144, 0.00000, 0.03805]
    link6: {mass: 0.2112, com: [0.02418, -0.00977, -0.02113]}  # CAD 0.1000 kg, [0.00002, 0.00000, 0.00435]

# 重力标定（2026-10-23）：driver_probe calibrate 在 config/gravity_calibration_poses.yaml 的 25 个无接触姿态上
# 以 0.04 rad/s 上下扫描，scripts/fit_gravity.py 以 CAD 为先验拟合连杆质量与质心。8 个验证姿态上 joint2/3/4
# 的残差 RMS 由 0.37/0.33/0.13 降到 0.14/0.12/0.05 N·m。同时测得 joint2-6 的库仑摩擦约
# 0.23/0.41/0.20/0.16/0.17 N·m。link6 的增量包含夹爪处未建模的质量（夹爪零件固定为 CAD）。
dynamics:
  links:
    link2: {mass: 1.5520, com: [-0.11351, 0.00159, -0.02716]}  # CAD 1.5520 kg, [-0.11786, -0.00342, -0.02716]
    link3: {mass: 1.1890, com: [0.11298, -0.04726, -0.02854]}  # CAD 1.2520 kg, [0.10343, -0.06641, -0.02711]
    link4: {mass: 0.4248, com: [0.06111, -0.05347, -0.03402]}  # CAD 0.4600 kg, [0.04755, -0.04411, -0.03141]
    link5: {mass: 0.2131, com: [0.01023, 0.00753, 0.03390]}  # CAD 0.2012 kg, [0.01144, 0.00000, 0.03805]
    link6: {mass: 0.2112, com: [0.02418, -0.00977, -0.02113]}  # CAD 0.1000 kg, [0.00002, 0.00000, 0.00435]

sim:
  physics_step_us: 500

# 电机零点与 URDF 零点一致、方向相同（reBotArm_control_py 2026-07-17 重力标定记录）。
driver:
  type: robstride_socketcan
  interface: can0
  host_id: 0xFD
  # connect 时关闭电机主动上报（只写内存，不保存）。
  disable_active_report: true
  # 不设置时不改动电机侧 CAN 超时。该机械臂无抱闸，超时后电机进入复位模式，机械臂会落下。
  # can_timeout_ms: 200
  actuators:
    - {joint: joint1, id: 0x01, model: rs-06}
    - {joint: joint2, id: 0x02, model: rs-06}
    - {joint: joint3, id: 0x03, model: rs-06}
    - {joint: joint4, id: 0x04, model: rs-00}
    - {joint: joint5, id: 0x05, model: rs-00}
    - {joint: joint6, id: 0x06, model: rs-00}
    # 小齿轮齿条：7.353 mm/rad（reBot-Isaacsim 夹爪实测）。真机核对：张开为电机正转，电机零点即闭合位置。
    # 行程接近一圈，上电时夹爪张开超过约 23 mm 的读数由驱动按限位中点纠正整圈。
    - {joint: gripper, id: 0x07, model: rs-00, transmission: {scale: 0.007353, offset: 0.0}}
